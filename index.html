<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#062d1d">
  <title>Imran Khan | Time in Jail</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>
  <div class="vignette"></div>

  <main class="page">

    <header class="hero">
      <div class="badge">REMEMBERING EVERY SECOND</div>

      <h1>Imran Khan</h1>

      <p class="headline">Time in Jail</p>

      <p class="since">
        Since <strong>5 August 2023</strong>
      </p>
    </header>


    <section class="counter-card" aria-label="Live jail time counter">

      <div class="counter-grid">

        <div class="time-box">
          <span id="years">0</span>
          <small>Years</small>
        </div>

        <div class="time-box">
          <span id="months">00</span>
          <small>Months</small>
        </div>

        <div class="time-box">
          <span id="days">00</span>
          <small>Days</small>
        </div>

        <div class="time-box">
          <span id="hours">00</span>
          <small>Hours</small>
        </div>

        <div class="time-box">
          <span id="minutes">00</span>
          <small>Minutes</small>
        </div>

        <div class="time-box seconds">
          <span id="seconds">00</span>
          <small>Seconds</small>
        </div>

        <div class="time-box milliseconds">
          <span id="milliseconds">000</span>
          <small>Milliseconds</small>
        </div>

      </div>


      <div class="total">
        <span class="total-label">Total days</span>
        <strong id="totalDays">0</strong>
      </div>

    </section>


    <section class="support">

      <button
        id="loveButton"
        class="love-button"
        type="button"
        aria-label="Send love and support"
      >
        <span class="heart">♥</span>
        <span class="love-text">Love &amp; Support</span>
        <span class="love-count" id="loveCount">0</span>
      </button>

      <p class="support-note">
        Every click represents a message of love, hope and support.
      </p>

    </section>


    <footer>
      <span>Live counter • Updates automatically</span>
      <span class="dot">•</span>
      <span>Pakistan</span>
    </footer>

  </main>


  <div id="heartBurst" class="heart-burst" aria-hidden="true"></div>


  <!-- JavaScript -->
  <script src="./script.js"></script>

</body>
  </html>
